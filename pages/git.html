    <!-- Contenu principal -->
    <main>
      <div class="construction">
        <div class="construction-icone" aria-hidden="true">🚧</div>
        <h1>Git : page en construction</h1>
        <p>Cette page est en construction. <strong>Revenez bientôt !</strong></p>
        <p><button><a href="../index.html">Retour à l'accueil</a></button></p>
      </div>
    </main>
    <!-- Pied de page : formulaire de contact + droits d'auteur -->
    <footer>
      <section class="contact" aria-labelledby="titre-contact-git">
        <h2 id="titre-contact-git">Contactez-nous</h2>
        <!-- form : conteneur du formulaire. method="post" envoie les données dans le corps de la requête,
             action="#" indique l'adresse du script qui traitera les données (à remplacer par un script serveur) -->
        <form class="contact-form" method="post" action="#">
          <!-- label lié par for/id au champ : améliore l'accessibilité -->
          <label for="nom-git">Nom</label>
          <!-- name : nom sous lequel la valeur est envoyée ; required : champ obligatoire -->
          <input type="text" id="nom-git" name="nom" placeholder="Votre nom" required />
          <label for="email-git">Email</label>
          <!-- type="email" : le navigateur vérifie le format d'une adresse email -->
          <input type="email" id="email-git" name="email" placeholder="vous@exemple.fr" required />
          <label for="message-git">Message</label>
          <!-- textarea : zone de texte multiligne -->
          <textarea id="message-git" name="message" rows="4" placeholder="Votre message" required></textarea>
          <!-- bouton qui déclenche l'envoi du formulaire -->
          <button type="submit">Envoyer</button>
        </form>
      </section>
      <!-- définition des droits d'auteur -->
      <p class="copyright">&copy; 2026 COURS SIO WEB LDV Melun. Tous droits réservés.</p>
    </footer>
    <!-- script en bas de page, après le footer -->
    <script src="../js/main.js"></script>
